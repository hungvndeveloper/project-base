<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter Layout with Bootstrap 5 & BEM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Base Reset */
    * {
      box-sizing: border-box;
    }

    body.page {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    .page__wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background-color: #343a40;
      color: white;
    }

    .header__container {
      padding: 1rem 0;
    }

    .nav__list {
      display: flex;
      gap: 1rem;
      list-style: none;
      padding-left: 0;
    }

    .nav__link {
      color: white;
      text-decoration: none;
    }

    .main-content {
      flex: 1;
      padding: 2rem 0;
    }

    .footer {
      background-color: #212529;
      color: #adb5bd;
      padding: 1rem 0;
    }

    .footer__socials {
      list-style: none;
      display: flex;
      gap: 0.75rem;
      padding-left: 0;
    }

    .footer__link {
      color: #adb5bd;
      text-decoration: none;
    }

    /* Responsive tweaks */
    @media (max-width: 768px) {
      .nav__list {
        flex-direction: column;
      }
    }
  </style>
</head>

<body class="page">
  <div class="page__wrapper container">

    <!-- Header -->
    <header class="header">
      <div class="header__container d-flex justify-content-between align-items-center">
        <div class="header__logo fw-bold">MySite</div>
        <nav class="header__nav">
          <ul class="nav__list">
            <li class="nav__item"><a href="#" class="nav__link">Trang chủ</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Giới thiệu</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Dịch vụ</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Liên hệ</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="row g-4">
        <div class="col-md-8">
          <section class="features">
            <h2 class="features__title h4 mb-3">Tính năng</h2>
            <div class="row g-3">
              <div class="col-md-6">
                <div class="card feature-card">
                  <div class="card-body">
                    <h5 class="feature-card__title card-title">Nhanh chóng</h5>
                    <p class="feature-card__desc card-text">Phản hồi trong tích tắc.</p>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card feature-card">
                  <div class="card-body">
                    <h5 class="feature-card__title card-title">Bảo mật</h5>
                    <p class="feature-card__desc card-text">Bảo vệ người dùng tối đa.</p>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
        <div class="col-md-4">
          <aside class="sidebar">
            <h4 class="sidebar__title mb-3">Tin mới</h4>
            <ul class="list-unstyled sidebar__list">
              <li><a href="#" class="sidebar__link d-block mb-2">Bài viết 1</a></li>
              <li><a href="#" class="sidebar__link d-block mb-2">Bài viết 2</a></li>
              <li><a href="#" class="sidebar__link d-block">Bài viết 3</a></li>
            </ul>
          </aside>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
        <div class="footer__copyright">
          &copy; 2025 MyCompany. All rights reserved.
        </div>
        <ul class="footer__socials">
          <li><a href="#" class="footer__link">Facebook</a></li>
          <li><a href="#" class="footer__link">Twitter</a></li>
          <li><a href="#" class="footer__link">LinkedIn</a></li>
        </ul>
      </div>
    </footer>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
